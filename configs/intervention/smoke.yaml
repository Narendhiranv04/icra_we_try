# Configuration for Packet 2.5 Intervention Smoke Dataset (6 scenes, 22 accepted records)
schema_version: "2.1.0"
dataset_name: "intervention_smoke"
output_root: "data/intervention_smoke"
demonstration_reference: null

resolution: [640, 480]
min_relocation_m: 0.03
max_collateral_translation_m: 0.05
min_instance_pixels: 50
min_relation_target_pixels: 50
max_torso_fraction: 0.25

max_base_retries: 10
max_candidate_set_retries: 5

# Tolerances for independent validation
rgb_pre_reconstruction_rmse_tolerance: 1.0
rgb_post_reconstruction_rmse_tolerance: 1.0
none_rgb_rmse_tolerance: 3.0
camera_translation_tolerance_m: 0.001
camera_rotation_tolerance_rad: 0.005
geometry_position_tolerance_m: 0.001
geometry_quaternion_tolerance: 0.01

# Requested 6 base scenes
