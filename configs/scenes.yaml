# Scene Specification and Camera Configurations
scene:
  base_xml: "assets/kitchen_base.xml"
  object_library_xml: "assets/object_library.xml"
  settle_steps: 200
  physics_timestep: 0.002

cameras:
  front_camera:
    pos: [0.0, -1.2, 1.3]
    fovy: 45.0
    mode: "fixed"
    lookat: [0.0, 0.3, 0.85]
  side_camera:
    pos: [1.2, -0.2, 1.2]
    fovy: 45.0
    mode: "fixed"
    lookat: [0.0, 0.3, 0.85]

surfaces:
  B1_lid:
    center: [0.52, 0.18, 0.74]
    bounds: [0.35, 0.69, 0.09, 0.27, 0.73, 0.76]
    height_offset: 0.08
  target_region:
    center: [0.0, 0.20, 0.57]
    bounds: [-0.15, 0.15, 0.10, 0.30, 0.56, 0.58]
    radius: 0.15

object_catalog:
  coffee_can:
    geom_name: "gso_coffee_can"
    mesh_path: "objects/meshes/gso/coffee_can/model.obj"
    size: [0.04, 0.04, 0.06]
    mass: 0.2
  sugar_box:
    geom_name: "gso_sugar_box"
    mesh_path: "objects/meshes/gso/sugar_box/model.obj"
    size: [0.04, 0.03, 0.07]
    mass: 0.2
  mug:
    geom_name: "gso_mug"
    mesh_path: "objects/meshes/gso/mug/model.obj"
    size: [0.04, 0.04, 0.05]
    mass: 0.15
  cup:
    geom_name: "gso_cup"
    mesh_path: "objects/meshes/gso/cup/model.obj"
    size: [0.035, 0.035, 0.05]
    mass: 0.1
  bowl:
    geom_name: "gso_bowl"
    mesh_path: "objects/meshes/gso/bowl/model.obj"
    size: [0.06, 0.06, 0.04]
    mass: 0.2
